<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLD V4.4 WIDE STOP</title>
<style>
body{font-family:Arial,sans-serif;background:#0f1115;color:#e6e6e6;margin:0;padding:20px}
.card{max-width:600px;margin:20px auto;background:#1a1d24;border-radius:16px;padding:24px;border:1px solid #2a2e39}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;background:#00d084;color:#000;font-weight:700;font-size:13px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2a2e39}
.label{color:#8b92a8} .value{font-weight:600}
.btn{display:block;text-align:center;margin-top:16px;padding:12px;background:#2a2e39;border-radius:10px;color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="card">
<h1>GOLD V4.4 WIDE STOP Bot</h1>
<div id="statusBadge" class="badge">Betoltes...</div>
<div class="row"><span class="label">Allapot</span><span class="value" id="allapot">-</span></div>
<div class="row"><span class="label">Utolso</span><span class="value" id="utolso">-</span></div>
<div class="row"><span class="label">Ar</span><span class="value" id="ar">-</span></div>
<div class="row"><span class="label">RSI</span><span class="value" id="rsi">-</span></div>
<div class="row"><span class="label">ATR</span><span class="value" id="atr">-</span></div>
<div class="row"><span class="label">Stop</span><span class="value" id="stopTav">-</span></div>
<div class="row"><span class="label">EMA</span><span class="value" id="ema">9/21/50</span></div>
<div class="row"><span class="label">Jelek</span><span class="value" id="jelek">-</span></div>
<div class="row"><span class="label">Utolso jel</span><span class="value" id="utolsoJel">-</span></div>
<div class="row"><span class="label">Aktiv</span><span class="value" id="aktivTrade">-</span></div>
<div class="row"><span class="label">Frissitve</span><span class="value" id="friss">-</span></div>
</div>
<script>
async function load(){
 try{
  const res = await fetch('/status');
  const d = await res.json();
  document.getElementById('allapot').innerText = d.allapot;
  document.getElementById('utolso').innerText = d.utolso_ellenorzes;
  document.getElementById('ar').innerText = d.aktualis_ar ? d.aktualis_ar.toFixed(2) : '-';
  document.getElementById('rsi').innerText = d.rsi || '-';
  document.getElementById('atr').innerText = d.atr ? d.atr.toFixed(2) : '-';
  document.getElementById('stopTav').innerText = d.stop_tav || '-';
  document.getElementById('jelek').innerText = d.mai_jelek ?? '-';
  document.getElementById('utolsoJel').innerText = d.utolso_jel || '-';
  document.getElementById('friss').innerText = d.frissitve || '-';
  document.getElementById('statusBadge').innerText = 'V4.4 WIDE - Fut';
 }catch(e){ document.getElementById('statusBadge').innerText='Hiba'; }
}
load(); setInterval(load,30000);
</script>
</body>
</html>
